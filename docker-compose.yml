# ONDA Agentic RAG — Infrastructure
# Services: PostgreSQL 17 + pgvector, Keycloak 24
# Optional: Spring Boot RAG Engine (--profile app)
# Usage:
#   Infrastructure only:  docker compose up -d
#   With app:             docker compose --profile app up -d

services:

  # 1. PostgreSQL 17 + pgvector
  #    - pgvector extension: vector similarity search (HNSW / Cosine)
  #    - init.sql: creates extensions, domain tables, vector_store, indexes
  postgres:
    image: pgvector/pgvector:pg17
    container_name: onda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onda_rag_db}
      POSTGRES_USER: ${POSTGRES_USER:-onda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onda_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onda_user} -d ${POSTGRES_DB:-onda_rag_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Keycloak 24 — Identity Provider
  #    Realm:  onda-rag-realm
  #    Client: onda-rag-api
  #    Roles:  ROLE_USER, ROLE_INGESTOR, ROLE_ADMIN
  #    Port:   8081 (host) → 8080 (container) to free 8080 for Spring Boot
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: onda-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_password}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-PbFRHqc2lOgQSsAWmLNSd9h8kklsSwuE}
      KC_HTTP_PORT: 8080
    ports:
      - "8081:8080"
    volumes:
      - ./docker/keycloak/onda-rag-realm-export.json:/opt/keycloak/data/import/onda-rag-realm-export.json
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /realms/onda-rag-realm/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # 3. ONDA Spring Boot Agentic RAG Engine (Optional — profile: app)
  #    Start with:  docker compose --profile app up -d
  #    Requires:    /app/Dockerfile at repo root
  rag-engine:
    profiles: ["app"]
    build:
      context: ../../app
      dockerfile: Dockerfile
    container_name: onda-agentic-rag
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-onda_rag_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-onda_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-onda_password}
      # Keycloak resource server — internal docker network uses container port 8080
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-onda-rag-realm}
      # Keycloak service account used by the identity module.
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-onda-rag-realm}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-onda-rag-api}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-PbFRHqc2lOgQSsAWmLNSd9h8kklsSwuE}
      SPRING_AI_VECTORSTORE_PGVECTOR_DIMENSION: 768
      SPRING_AI_VECTORSTORE_PGVECTOR_DISTANCE_TYPE: COSINE_DISTANCE
      SPRING_AI_VECTORSTORE_PGVECTOR_INDEX_TYPE: HNSW
      SPRING_AI_VERTEX_AI_GEMINI_API_KEY: ${GEMINI_API_KEY}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # 4. Local observability stack. Prometheus scrapes a Spring Boot process
  # running on the host at http://host.docker.internal:8080/actuator/prometheus.
  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: onda-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  tempo:
    image: grafana/tempo:2.9.0
    container_name: onda-tempo
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
      - "4318:4318"
    volumes:
      - ./docker/observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo

  grafana:
    image: grafana/grafana:12.3.2
    container_name: onda-grafana
    profiles: ["observability"]
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  tempo_data:
    driver: local
