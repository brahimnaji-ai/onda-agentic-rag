name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: dummy-ci-key
      GEMINI_PROJECT_ID: dummy-project
      TAVILY_API_KEY: dummy-tavily
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test with Maven
        run: ./mvnw -B -ntp verify