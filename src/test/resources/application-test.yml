spring:
  datasource:
    url: jdbc:h2:mem:onda_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

  # Disable migration tools — schema is managed by Hibernate in slice tests
  flyway:
    enabled: false
  liquibase:
    enabled: false

  # Silence Keycloak / OAuth2 auto-config; issuer-uri is never called in @DataJpaTest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/onda-rag-realm

logging:
  level:
    org.hibernate.SQL: WARN
    ma.onda.rag: DEBUG
