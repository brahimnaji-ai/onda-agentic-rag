spring:
  application:
    name: onda-agentic-rag
  config:
    import: "optional:file:.env[.properties]"
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:onda_rag_db}
    username: ${POSTGRES_USER:onda_user}
    password: ${POSTGRES_PASSWORD:onda_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true


  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/onda-rag-realm}
      client:
        registration:
          keycloak-admin:
            provider: keycloak-admin
            client-id: ${KEYCLOAK_CLIENT_ID:onda-rag-api}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            scope: openid

        provider:
          keycloak-admin:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8081/realms/onda-rag-realm/protocol/openid-connect/token}

  ai:
    model:
      chat: google-genai
      embedding: ollama
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        project-id: ${GEMINI_PROJECT_ID:gen-lang-client-0318410907}
        chat:
          model: ${GEMINI_CHAT_MODEL:gemini-3.1-flash-lite}
    ollama:
      base-url: http://localhost:11434
      embedding:
        model: nomic-embed-text

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE



# ====== properties for Keycloak integration ======
keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8081}
  realm: ${KEYCLOAK_REALM:onda-rag-realm}
  client-id: ${KEYCLOAK_CLIENT_ID:onda-rag-api}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:PbFRHqc2lOgQSsAWmLNSd9h8kklsSwuE}

# ===== properties for RAG (Retrieval-Augmented Generation) =====
rag:
  pre-retrieval:
    rewrite:
      enabled: true
  retrieval:
    top-k: 8
    similarity-threshold: 0.5
  post-retrieval:
    max-documents: 4

# ===== properties for Tavily integration =====
tavily:
  api-key: ${TAVILY_API_KEY}

# ===== observability =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  otlp:
    metrics:
      export:
        # Prometheus pulls metrics from /actuator/prometheus; no local OTLP
        # collector is part of this development stack.
        enabled: false
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false
